[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyXOD"
version = "0.1.0"
description = "LOX and LOX-R: model-agnostic local explainers for unsupervised outlier detection."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Anonymous" }]
dependencies = ["numpy>=1.22", "scipy>=1.9", "scikit-learn>=1.1", "pandas>=2.0"]

[project.optional-dependencies]
explain = ["shap>=0.44.0", "pyod>=1.1.0", "matplotlib>=3.7", "seaborn>=0.13"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
